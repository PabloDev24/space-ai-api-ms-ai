name: Deploy ms-ai to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/spaceia-ms-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Service for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-spaceia-ms-ai
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_MS_AI }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/spaceia-ms-ai:latest
