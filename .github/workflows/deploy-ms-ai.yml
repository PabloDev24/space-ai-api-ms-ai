name: Deploy ms-ai to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/spaceia-ms-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OIDC federated login — no client secret stored, Azure trusts this
      # workflow directly (App registration "spaceia-ms-ai-deploy", scoped
      # to Website Contributor on this one App Service only).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service for Containers
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --resource-group rg-spaceia-demo \
              --name app-spaceia-ms-ai \
              --container-image-name ${{ secrets.ACR_LOGIN_SERVER }}/spaceia-ms-ai:latest \
              --container-registry-url https://${{ secrets.ACR_LOGIN_SERVER }} \
              --container-registry-user ${{ secrets.ACR_USERNAME }} \
              --container-registry-password ${{ secrets.ACR_PASSWORD }}
            az webapp restart --resource-group rg-spaceia-demo --name app-spaceia-ms-ai
